<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Question 🤍</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #10091c;
      --card: rgba(35, 20, 54, 0.74);
      --card-border: rgba(255, 255, 255, 0.16);
      --white: #fff7ff;
      --soft-white: #eadcf2;
      --muted: #bcaac7;
      --pink: #f9a8d4;
      --rose: #fb7185;
      --purple: #c084fc;
      --blue: #93c5fd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(192, 132, 252, 0.25),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(251, 113, 133, 0.19),
          transparent 30%
        ),
        linear-gradient(135deg, #090611, var(--background));
      font-family: "DM Sans", sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.55;
    }

    body::before {
      top: 12%;
      left: 11%;
      width: 8px;
      height: 8px;
      background: var(--pink);
      box-shadow:
        110px 90px 0 rgba(255, 255, 255, 0.7),
        250px 30px 0 rgba(192, 132, 252, 0.7),
        390px 160px 0 rgba(147, 197, 253, 0.7),
        70px 330px 0 rgba(251, 113, 133, 0.7);
    }

    body::after {
      right: 10%;
      bottom: 14%;
      width: 6px;
      height: 6px;
      background: var(--purple);
      box-shadow:
        -140px -70px 0 rgba(255, 255, 255, 0.65),
        -260px -180px 0 rgba(249, 168, 212, 0.75),
        -70px -250px 0 rgba(147, 197, 253, 0.65);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100% - 32px, 650px);
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: auto;
      padding: 24px 0;
    }

    .question-card {
      position: relative;
      width: 100%;
      padding: 48px 30px 42px;
      overflow: hidden;
      text-align: center;
      border: 1px solid var(--card-border);
      border-radius: 32px;
      background: var(--card);
      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(18px);
      animation: cardAppear 0.8s ease both;
    }

    .question-card::before {
      content: "";
      position: absolute;
      top: -100px;
      left: 50%;
      width: 280px;
      height: 200px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(249, 168, 212, 0.15);
      filter: blur(35px);
      pointer-events: none;
    }

    .heart {
      position: relative;
      z-index: 1;
      display: inline-block;
      margin-bottom: 20px;
      color: var(--pink);
      font-size: 35px;
      filter: drop-shadow(0 0 15px rgba(249, 168, 212, 0.55));
      animation: heartbeat 2.2s ease-in-out infinite;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      margin: 0 0 13px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--white);
      font-family: "Playfair Display", serif;
      font-size: clamp(34px, 8vw, 58px);
      line-height: 1.15;
      letter-spacing: -1px;
    }

    .question-mark {
      color: var(--pink);
    }

    .subtitle {
      position: relative;
      z-index: 1;
      max-width: 420px;
      margin: 19px auto 0;
      color: var(--soft-white);
      font-size: 14px;
      line-height: 1.8;
    }

    .small-note {
      position: relative;
      z-index: 1;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .buttons-area {
      position: relative;
      z-index: 2;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 30px;
    }

    .answer-button {
      min-width: 142px;
      padding: 13px 22px;
      border: 1px solid transparent;
      border-radius: 14px;
      font: 700 14px "DM Sans", sans-serif;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.2s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
    }

    .yes-button {
      color: #351026;
      background: linear-gradient(135deg, #fbcfe8, #f9a8d4);
      box-shadow: 0 10px 25px rgba(249, 168, 212, 0.22);
    }

    .yes-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(249, 168, 212, 0.34);
    }

    .no-button {
      color: var(--soft-white);
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.07);
      transition:
        left 0.18s ease,
        top 0.18s ease,
        transform 0.18s ease;
    }

    .no-button:hover {
      background: rgba(255, 255, 255, 0.11);
    }

    .footer-note {
      position: relative;
      z-index: 1;
      margin: 28px 0 0;
      color: #9f8baa;
      font-size: 10px;
    }

    .yay-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(
          circle at center,
          rgba(249, 168, 212, 0.16),
          transparent 40%
        ),
        rgba(16, 9, 28, 0.92);
      backdrop-filter: blur(8px);
    }

    .yay-screen.show {
      display: grid;
    }

    .yay-content {
      position: relative;
      z-index: 3;
      text-align: center;
      animation: yayEntrance 1.05s cubic-bezier(.2, .85, .3, 1.4) both;
    }

    .yay-title {
      margin: 0;
      color: #fff7ff;
      font-family: "Playfair Display", serif;
      font-size: clamp(58px, 17vw, 145px);
      line-height: 1;
      letter-spacing: -3px;
      text-shadow:
        0 0 12px rgba(249, 168, 212, 0.7),
        0 0 36px rgba(192, 132, 252, 0.55);
      animation: yayJump 1.1s ease-in-out infinite;
    }

    .yay-heart {
      display: inline-block;
      color: var(--pink);
      font-size: 0.55em;
      vertical-align: middle;
      animation: tinyHeart 0.9s ease-in-out infinite alternate;
    }

    .yay-subtitle {
      margin: 24px 0 0;
      color: var(--soft-white);
      font-size: clamp(14px, 3vw, 20px);
      letter-spacing: 1px;
      animation: softAppear 1s ease 0.35s both;
    }

    .confetti {
      position: absolute;
      top: -30px;
      width: 10px;
      height: 18px;
      border-radius: 3px;
      opacity: 0;
      animation: fall linear forwards;
    }

    .confetti:nth-child(1) {
      left: 5%;
      background: #f9a8d4;
      animation-delay: 0.05s;
      animation-duration: 3.8s;
    }

    .confetti:nth-child(2) {
      left: 13%;
      background: #c084fc;
      animation-delay: 0.2s;
      animation-duration: 4.4s;
    }

    .confetti:nth-child(3) {
      left: 23%;
      background: #93c5fd;
      animation-delay: 0.4s;
      animation-duration: 3.6s;
    }

    .confetti:nth-child(4) {
      left: 34%;
      background: #fb7185;
      animation-delay: 0.1s;
      animation-duration: 4.1s;
    }

    .confetti:nth-child(5) {
      left: 46%;
      background: #fde68a;
      animation-delay: 0.3s;
      animation-duration: 3.7s;
    }

    .confetti:nth-child(6) {
      left: 58%;
      background: #f9a8d4;
      animation-delay: 0.15s;
      animation-duration: 4.2s;
    }

    .confetti:nth-child(7) {
      left: 69%;
      background: #c084fc;
      animation-delay: 0.35s;
      animation-duration: 3.9s;
    }

    .confetti:nth-child(8) {
      left: 80%;
      background: #93c5fd;
      animation-delay: 0.05s;
      animation-duration: 4.5s;
    }

    .confetti:nth-child(9) {
      left: 91%;
      background: #fb7185;
      animation-delay: 0.25s;
      animation-duration: 3.8s;
    }

    .floating-heart {
      position: absolute;
      z-index: 1;
      color: var(--pink);
      font-size: 30px;
      opacity: 0;
      animation: floatHeart 3.8s ease-in forwards;
    }

    .floating-heart:nth-of-type(10) {
      left: 17%;
      bottom: 0;
      animation-delay: 0.2s;
    }

    .floating-heart:nth-of-type(11) {
      left: 77%;
      bottom: 0;
      color: var(--purple);
      animation-delay: 0.65s;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes heartbeat {
      0%,
      100% {
        transform: scale(1);
      }

      15% {
        transform: scale(1.12);
      }

      30% {
        transform: scale(1);
      }

      45% {
        transform: scale(1.08);
      }

      60% {
        transform: scale(1);
      }
    }

    @keyframes yayEntrance {
      0% {
        opacity: 0;
        transform: scale(0.2) translateY(40px) rotate(-8deg);
      }

      55% {
        opacity: 1;
        transform: scale(1.16) translateY(-15px) rotate(3deg);
      }

      78% {
        transform: scale(0.94) translateY(4px) rotate(-1deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0) rotate(0);
      }
    }

    @keyframes yayJump {
      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      35% {
        transform: translateY(-13px) rotate(-2deg);
      }

      65% {
        transform: translateY(2px) rotate(2deg);
      }
    }

    @keyframes tinyHeart {
      from {
        transform: scale(1) rotate(-8deg);
      }

      to {
        transform: scale(1.25) rotate(8deg);
      }
    }

    @keyframes softAppear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fall {
      0% {
        opacity: 0;
        transform: translateY(-30px) rotate(0deg);
      }

      10% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translateY(110vh) rotate(760deg);
      }
    }

    @keyframes floatHeart {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.6) rotate(-15deg);
      }

      15% {
        opacity: 0.9;
      }

      100% {
        opacity: 0;
        transform: translateY(-90vh) scale(1.3) rotate(20deg);
      }
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 20px, 650px);
      }

      .question-card {
        padding: 40px 20px 34px;
        border-radius: 27px;
      }

      .subtitle {
        font-size: 13px;
      }

      .buttons-area {
        min-height: 125px;
        gap: 10px;
      }

      .answer-button {
        min-width: 128px;
        padding: 12px 15px;
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="question-card">

      <div class="heart">♡</div>

      <p class="eyebrow">
        just one little question
      </p>

      <h1>
        Do you still<br>
        love me<span class="question-mark">?</span>
      </h1>

      <p class="subtitle">
        No pressure, no perfect answer…
        I just wanted to ask something from my heart.
      </p>

      <p class="small-note">
        choose honestly 🤍
      </p>

      <div class="buttons-area">

        <button class="answer-button yes-button" type="button">
          Yes, I do 🤍
        </button>

        <button class="answer-button no-button" type="button">
          No
        </button>

      </div>

      <p class="footer-note">
        some questions are too important to leave unasked
      </p>

    </section>

  </main>

  <section class="yay-screen" id="yayScreen">

    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

    <div class="floating-heart">♡</div>
    <div class="floating-heart">♡</div>

    <div class="yay-content">

      <h2 class="yay-title">
        YAAAY <span class="yay-heart">♡</span>
      </h2>

      <p class="yay-subtitle">
        you just made my heart smile
      </p>

    </div>

  </section>

  <script>
    const noButton = document.querySelector(".no-button");
    const yesButton = document.querySelector(".yes-button");
    const buttonsArea = document.querySelector(".buttons-area");
    const yayScreen = document.getElementById("yayScreen");

    let noButtonMoved = false;

    function getRandomPosition(pointerX, pointerY) {
      const buttonWidth = noButton.offsetWidth;
      const buttonHeight = noButton.offsetHeight;

      const padding = 14;

      const minX = padding;
      const minY = padding;

      const maxX = window.innerWidth - buttonWidth - padding;
      const maxY = window.innerHeight - buttonHeight - padding;

      let randomX;
      let randomY;
      let attempts = 0;

      do {
        randomX = Math.floor(
          minX + Math.random() * Math.max(1, maxX - minX)
        );

        randomY = Math.floor(
          minY + Math.random() * Math.max(1, maxY - minY)
        );

        attempts++;

        const distance = Math.hypot(
          randomX + buttonWidth / 2 - pointerX,
          randomY + buttonHeight / 2 - pointerY
        );

        if (distance > 150 || attempts > 30) {
          break;
        }
      } while (true);

      return {
        x: randomX,
        y: randomY
      };
    }

    function moveNoButton(event) {
      if (event) {
        event.preventDefault();
      }

      const pointerX = event?.clientX ?? window.innerWidth / 2;
      const pointerY = event?.clientY ?? window.innerHeight / 2;

      const position = getRandomPosition(pointerX, pointerY);

      noButtonMoved = true;

      noButton.style.position = "fixed";
      noButton.style.left = `${position.x}px`;
      noButton.style.top = `${position.y}px`;
      noButton.style.zIndex = "100";
    }

    noButton.addEventListener("pointerenter", moveNoButton);
    noButton.addEventListener("pointerdown", moveNoButton);

    noButton.addEventListener("touchstart", moveNoButton, {
      passive: false
    });

    yesButton.addEventListener("click", () => {
      yayScreen.classList.add("show");
    });

    window.addEventListener("resize", () => {
      if (!noButtonMoved) return;

      const currentRect = noButton.getBoundingClientRect();

      const safeX = Math.min(
        Math.max(14, currentRect.left),
        window.innerWidth - noButton.offsetWidth - 14
      );

      const safeY = Math.min(
        Math.max(14, currentRect.top),
        window.innerHeight - noButton.offsetHeight - 14
      );

      noButton.style.left = `${safeX}px`;
      noButton.style.top = `${safeY}px`;
    });
  </script>

</body>

</html>
