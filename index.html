<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yomna | My World 🎀</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* الحقل الحقيقي */
    .garden-strip {
      background: linear-gradient(to bottom, #10b981 0%, #064e3b 100%);
      position: relative;
      height: 120px;
      overflow: hidden;
    }
    /* البنت اللي بتمشي */
    .walking-girl {
      position: absolute;
      bottom: 0px;
      width: 100px; /* تحكمي في الحجم من هنا */
      animation: walk 15s linear infinite;
    }
    @keyframes walk {
      0% { left: -150px; transform: scaleX(1); }
      49% { left: 100%; transform: scaleX(1); }
      50% { left: 100%; transform: scaleX(-1); }
      100% { left: -150px; transform: scaleX(-1); }
    }
  </style>
</head>
<body class="bg-[#0f172a] text-slate-100 p-6">

  <!-- قسم الحقل والبنت -->
  <div class="garden-strip rounded-3xl mb-10 shadow-lg border border-emerald-500/20">
    <!-- حطي هنا صورة الـ GIF بتاعت البنت الـ 3D -->
    <img src="YOUR_3D_WALKING_GIRL.gif" class="walking-girl" alt="Walking Girl">
  </div>

  <!-- قسم اللعبة -->
  <section class="max-w-lg mx-auto bg-slate-900 p-6 rounded-3xl border border-pink-500/20 text-center">
    <h3 class="text-xl font-bold mb-4">Catch the Real Candy 🍬</h3>
    <canvas id="gameCanvas" width="400" height="300" class="bg-black/40 rounded-xl mx-auto"></canvas>
  </section>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // صورة الكاندي الحقيقية (حطي رابط الصورة هنا)
    const candyImg = new Image();
    candyImg.src = 'REAL_CANDY_IMAGE.png'; 

    let score = 0;
    let basketX = 170;
    let candies = [{x: 50, y: 0}];

    function draw() {
      ctx.clearRect(0, 0, 400, 300);
      
      // رسم الكاندي كصورة بدل الدوائر
      candies.forEach(c => {
        c.y += 2;
        ctx.drawImage(candyImg, c.x, c.y, 40, 40); // 40x40 حجم الصورة
      });

      // رسم السلة (ممكن تبدليها بصورة سلة برضه)
      ctx.fillStyle = "#eab308";
      ctx.fillRect(basketX, 260, 60, 30);
      
      requestAnimationFrame(draw);
    }
    
    canvas.addEventListener('mousemove', (e) => {
      basketX = e.offsetX - 30;
    });

    draw();
  </script>
</body>
</html>
